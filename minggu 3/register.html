<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="bg-gray-800">
    <div class="flex items-center justify-center w-full min-h-screen py-10">
        <div class="bg-gray-900 block w-full max-w-md border text-white rounded-lg shadow-xs">
            <a href="#">
                <img class="rounded-t-lg w-full flex object-cover h-70" src="/asset/rks.png" alt="Header Image" />
            </a>
            <div class="p-6 text-center">
                <span class="inline-flex items-center bg-gray-700 border border-gray-600 text-white text-xs font-medium px-2 py-1 rounded-sm mb-4">
                    <svg class="w-3 h-3 me-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.122 17.645a7.185 7.185 0 0 1-2.656 2.495 7.06 7.06 0 0 1-3.52.853 6.617 6.617 0 0 1-3.306-.718 6.73 6.73 0 0 1-2.54-2.266c-2.672-4.57.287-8.846.887-9.668A4.448 4.448 0 0 0 8.07 6.31 4.49 4.49 0 0 0 7.997 4c1.284.965 6.43 3.258 5.525 10.631 1.496-1.136 2.7-3.046 2.846-6.216 1.43 1.061 3.985 5.462 1.754 9.23Z"/></svg>
                    REGISTER
                </span>
                
                <div class="input">
                    <form id="registerForm" action="dashboard.html" method="GET">
                        <div class="user-input flex flex-col text-left mb-3">
                            <label for="username" class="text-sm mb-1">Username</label>
                            <input type="text" id="username" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500">
                        </div>
                        <div class="user-input flex flex-col text-left mb-3">
                            <label for="password" class="text-sm mb-1">Password</label>
                            <input type="password" id="password" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500">
                        </div>
                        <div class="user-input flex flex-col text-left mb-3">
                            <label for="nama" class="text-sm mb-1">Nama Lengkap</label>
                            <input type="text" id="nama" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500">
                        </div>
                        <div class="user-input flex flex-col text-left mb-3">
                            <label for="tgl_lahir" class="text-sm mb-1">Tanggal Lahir</label>
                            <input type="date" id="tgl_lahir" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500">
                        </div>
                        <div class="user-input flex flex-col text-left mb-3">
                            <label for="alamat" class="text-sm mb-1">Alamat</label>
                            <textarea id="alamat" rows="2" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500"></textarea>
                        </div>
                        <div class="user-input flex flex-col text-left mb-4">
                            <label for="telp" class="text-sm mb-1">Nomor Telepon</label>
                            <input type="number" id="telp" placeholder="628xxx" class="border p-2 rounded-lg border-gray-600 w-full outline-none focus:ring-2 focus:ring-gray-500">
                        </div>
                        <button type="submit" class="w-full inline-flex justify-center items-center bg-gray-500 rounded text-white box-border border border-transparent hover:bg-gray-600 focus:ring-4 shadow-xs font-medium leading-5 text-sm px-4 py-2.5 focus:outline-none mt-2">
                            Register
                        </button>
                    </form>
                </div>
                <a href="index.html">
                    <h5 class="mt-4 mb-2 text-xl font-semibold tracking-tight text-heading">Already have an account? Login.</h5>
                </a>
            </div>
        </div>
    </div>

    <script src="validasi.js"></script>
</body>
</html>
